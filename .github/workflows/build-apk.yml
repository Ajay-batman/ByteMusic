name: Build ByteMusic Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test-apk:
    name: Build & Cloud Sandbox Test ByteMusic APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Clean-Room Obligations
        run: npm run verify

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npm run cap:sync

      - name: Accept Android SDK Licenses & Install API 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build Debug APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Run Android Cloud Sandbox Background Audio Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            echo "=================================================="
            echo "ANDROID CLOUD SANDBOX: BYTE MUSIC VERIFICATION"
            echo "=================================================="
            
            echo "[Step 1] Installing ByteMusic Debug APK..."
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            
            echo "[Step 2] Launching com.bytemusic.app/.MainActivity..."
            adb shell am start -n com.bytemusic.app/.MainActivity
            sleep 8
            
            echo "[Step 3] Verifying Foreground BackgroundAudioService is Active..."
            adb shell dumpsys activity services | grep -i "BackgroundAudioService" || true
            
            echo "[Step 4] Simulating Screen Off / Power Key (Lock Device)..."
            adb shell input keyevent 26
            sleep 5
            
            echo "[Step 5] Checking Service & Process Persistence with Screen Locked..."
            adb shell dumpsys activity services | grep -E "(BackgroundAudioService|foreground)"
            
            echo "[Step 6] Verifying Process is Alive and Healthy..."
            APP_PID=$(adb shell pidof com.bytemusic.app)
            echo "ByteMusic PID: $APP_PID"
            if [ -z "$APP_PID" ]; then
              echo "FAIL: App process crashed in background!"
              exit 1
            fi
            
            echo "[Step 7] Waking Screen Back Up..."
            adb shell input keyevent 26
            sleep 3
            
            echo "=================================================="
            echo "CLOUD SANDBOX VERIFICATION: ALL CHECKS PASSED!"
            echo "=================================================="

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ByteMusic-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: android/app/build/reports/
