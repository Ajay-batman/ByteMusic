<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ByteMusic</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ByteMusic" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
    <script>
      // Keep background audio active: override Page Visibility API
      try {
        Object.defineProperties(document, {
          hidden: { value: false, writable: false },
          visibilityState: { value: 'visible', writable: false },
          webkitHidden: { value: false, writable: false },
          webkitVisibilityState: { value: 'visible', writable: false },
        });
        if (typeof document.hasFocus === 'function') {
          document.hasFocus = function() { return true; };
        }
        try { Object.defineProperty(document, 'onvisibilitychange', { get: function() { return null; }, set: function() {} }); } catch (e) {}
        try { Object.defineProperty(window, 'onpagehide', { get: function() { return null; }, set: function() {} }); } catch (e) {}
        try { Object.defineProperty(window, 'onblur', { get: function() { return null; }, set: function() {} }); } catch (e) {}
        window.addEventListener('visibilitychange', function(e) { e.stopImmediatePropagation(); }, true);
        document.addEventListener('visibilitychange', function(e) { e.stopImmediatePropagation(); }, true);
        document.addEventListener('webkitvisibilitychange', function(e) { e.stopImmediatePropagation(); }, true);
        window.addEventListener('blur', function(e) { e.stopImmediatePropagation(); }, true);
        window.addEventListener('pagehide', function(e) { e.stopImmediatePropagation(); }, true);
        window.addEventListener('freeze', function(e) { e.stopImmediatePropagation(); }, true);
      } catch (e) {}
    </script>
    <script src="https://www.youtube.com/iframe_api" async defer></script>
  </head>
  <body class="bg-black text-white m-0 p-0 overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
